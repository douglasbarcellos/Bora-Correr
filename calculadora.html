<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Pace - Bora Correr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">Bora Correr</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white active" href="calculadora.html">Calculadora de Pace</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">
                    <i class="bi bi-calculator"></i> Calculadora de Pace
                </h2>

                <!-- Formulário: Calcular Pace -->
                <div class="calc-form">
                    <h5 class="mb-3">Calcular Pace</h5>
                    
                    <div class="mb-3">
                        <label for="pace-distance" class="form-label">Distância (km)</label>
                        <div class="input-group">
                            <input type="number" id="pace-distance" class="form-control" step="0.01" min="0.01" placeholder="10">
                            <span class="input-group-text">km</span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tempo</label>
                        <div class="row g-2">
                            <div class="col-4">
                                <input type="number" id="pace-hours" class="form-control" min="0" placeholder="0" value="0">
                                <small class="text-muted">Horas</small>
                            </div>
                            <div class="col-4">
                                <input type="number" id="pace-minutes" class="form-control" min="0" max="59" placeholder="50" value="0">
                                <small class="text-muted">Minutos</small>
                            </div>
                            <div class="col-4">
                                <input type="number" id="pace-seconds" class="form-control" min="0" max="59" placeholder="0" value="0">
                                <small class="text-muted">Segundos</small>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100" onclick="calculatePace()">
                        <i class="bi bi-calculator"></i> Calcular Pace
                    </button>
                </div>

                <hr class="my-4">

                <!-- Resultados -->
                <div id="results" class="d-none">
                    <h5 class="mb-3">Resultados</h5>
                    
                    <div id="result-pace" class="result-card mb-3">
                        <div class="stat-label">Pace</div>
                        <div class="stat-value" id="result-pace-value">--:--</div>
                        <div class="stat-unit" id="result-pace-unit">min/km</div>
                    </div>

                    <div id="result-speed" class="result-card mb-3">
                        <div class="stat-label">Velocidade Média</div>
                        <div class="stat-value" id="result-speed-value">--</div>
                        <div class="stat-unit">km/h</div>
                    </div>

                    <div id="result-time" class="result-card mb-3">
                        <div class="stat-label">Tempo Total</div>
                        <div class="stat-value" id="result-time-value">--:--:--</div>
                    </div>

                    <div id="result-distance" class="result-card mb-3">
                        <div class="stat-label">Distância</div>
                        <div class="stat-value" id="result-distance-value">--</div>
                        <div class="stat-unit">km</div>
                    </div>

                    <div id="result-warning" class="alert alert-warning d-none" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> 
                        <span id="warning-message"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer mt-auto py-3 bg-primary text-white text-center">
        <div class="container">
            <span>© 2025 Cellão. Todos os direitos reservados.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="calculadora.js"></script>
</body>
</html>
